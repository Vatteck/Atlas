[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
description = "Arch-focused graphical package manager (Arch/AUR, Flatpak, AppImage)"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
authors = [{name = "Vatteck", email = "vatteck@github.com"}]
classifiers = [
        'Topic :: Utilities',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14'
]

dependencies = [
    "pywebview >= 4.2",  # 4.2 added the `icon` start param (sets the GTK window icon)
    "requests >= 2.18",
    "colorama >= 0.3.8",
    "pyyaml >= 3.13",
    "python-dateutil >= 2.7"
]

[project.optional-dependencies]
web = [
    "lxml >= 4.2.0",
    "beautifulsoup4 >= 4.7.0"
]

[project.scripts]
atlas = "atlas.app:main"
atlas-cli = "atlas.cli.app:main"

[project.urls]
Repository = "https://github.com/Vatteck/atlas"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "atlas.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests.*", "tests"]
