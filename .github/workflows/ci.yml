name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # Atlas is pure-Python; the pywebview GTK backend isn't needed for the test suite
        # (webview is imported lazily, only when a window is actually created).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

  # The front-end has ~57 node:test contract tests that guard main.js (the pywebview UI logic).
  # They're pure JS, so run them once here rather than per Python version.
  js:
    name: JS contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JS contract tests
        run: node --test tests/view/webview/main_js_contracts.test.js

  # Real-Arch job: the matrix above runs on Ubuntu and only exercises the pure-Python logic.
  # This runs the suite on actual Arch (real pacman) AND builds the wheel + checks the install
  # layout the PKGBUILDs produce — catching distro/packaging breakage the Ubuntu job can't.
  arch-build:
    name: Arch — tests + package build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        # desktop-file-utils → desktop-file-validate (packaging test, self-skips if absent).
        # diffutils → `diff`, used by the real-pacnew diff test (minimal container lacks it).
        run: pacman -Syu --noconfirm --needed git python python-pip desktop-file-utils diffutils

      - uses: actions/checkout@v6

      - name: Set up venv and install
        # A venv sidesteps Arch's PEP-668 externally-managed Python.
        run: |
          python -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt -e . pytest build installer setuptools wheel

      - name: Run tests on Arch
        run: |
          . /tmp/venv/bin/activate
          python -m pytest -q

      - name: Build wheel and verify install layout (mirrors the PKGBUILD package())
        run: |
          . /tmp/venv/bin/activate
          # makepkg build()s from a clean tree before check(); CI ran pytest first, so strip the
          # __pycache__ it left or setuptools bakes .pyc into the wheel.
          find atlas -name __pycache__ -type d -prune -exec rm -rf {} +
          python -m build --wheel --no-isolation
          # --prefix=/usr to match the PKGBUILD (which runs system python, prefix /usr); the venv
          # would otherwise install scripts under the venv prefix and the check below would miss them.
          python -m installer --destdir="$PWD/pkgroot" --prefix=/usr dist/*.whl
          for f in usr/bin/atlas usr/bin/atlas-cli; do
            test -f "pkgroot/$f" || { echo "missing $f in built package"; exit 1; }
          done
          echo "Arch build + install layout OK"
